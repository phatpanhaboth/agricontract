<!doctype html>
<html lang="km"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contract Check</title><link rel="icon" href="/agricontract/logo.svg">
<style>
:root { --bg: #edf1ee; --card: #fff; --ink: #172b23; --muted: #53635a; --line: #d3ddd6; --ok: #1d6b45; --okbg: #e3f2e9; --bad: #9a2525; --badbg: #f8e4e2; --warn: #7a5a12; --warnbg: #f6eed8; }
@media (prefers-color-scheme: dark) { :root { --bg: #101a15; --card: #18241e; --ink: #e8efe9; --muted: #a4b3aa; --line: #2c3b33; --ok: #7fd3a3; --okbg: #183526; --bad: #f1a29a; --badbg: #3a1c1a; --warn: #e8c878; --warnbg: #352c16; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 'Noto Sans Khmer', 'Khmer Sangam MN', system-ui, sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
.brand { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; margin-bottom: 12px; }
.brand img { width: 24px; height: 24px; }
.status { border-radius: 12px; padding: 18px 16px; margin-bottom: 12px; }
.status b { display: block; font-size: 22px; } .status small { display: block; margin-top: 4px; }
.s-ok { background: var(--okbg); color: var(--ok); } .s-bad { background: var(--badbg); color: var(--bad); } .s-warn { background: var(--warnbg); color: var(--warn); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 16px; margin-bottom: 12px; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; } .row span { color: var(--muted); } .row b { text-align: right; font-weight: 600; }
h2 { font-size: 15px; margin: 12px 0 0; color: var(--muted); font-weight: 600; }
.en { color: var(--muted); font-size: 13px; } .foot { color: var(--muted); font-size: 13px; }
</style></head>
<body data-demo-scripts="verify.js"><main aria-live="polite"><p>កំពុងពិនិត្យ… / Checking…</p></main><script src="/agricontract/browser-runtime.js"></script></body></html>
